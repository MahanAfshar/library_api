[project]
name = "library-api"
version = "0.1.0"
description = "library management"
readme = "README.md"
authors = [
    { name = "Mahan Afshar", email = "Mahan.ghaffarzadeh.afshar@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
library-api = "library_api:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
